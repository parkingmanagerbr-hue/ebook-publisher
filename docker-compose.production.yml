version: '3.8'

# ============================================================
# Deploy de Produção — GENIA EbookPublisher na VPS
# ============================================================
# Uso:
#   cd /home/deploy/ebook-publisher-work
#   docker compose -f docker-compose.production.yml pull ebook-publisher
#   docker compose -f docker-compose.production.yml up -d ebook-publisher
#
# Proxy: nginx em platform_internal, conf em /opt/platform/nginx/sites/16-ebook-publisher.conf

services:
  ebook-publisher:
    image: ghcr.io/parkingmanagerbr-hue/ebook-publisher:latest
    container_name: platform-ebook-publisher-1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DASHBOARD_PORT=3100
      - HEADLESS=true
    volumes:
      - ebook_pdfs:/app/data/pdfs
      - ebook_covers:/app/data/covers
      - ebook_db:/app/data
      - ebook_logs:/app/logs
    shm_size: '256mb'
    cap_add:
      - SYS_ADMIN
    networks:
      - platform_internal

volumes:
  ebook_pdfs:
    driver: local
  ebook_covers:
    driver: local
  ebook_db:
    driver: local
  ebook_logs:
    driver: local

networks:
  platform_internal:
    external: true
