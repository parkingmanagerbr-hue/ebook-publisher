<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — GENIA EbookPublisher</title>
<style>
  :root { --bg:#0a0e1a; --bg2:#111827; --accent:#6366f1; --accent2:#8b5cf6;
          --text:#f1f5f9; --muted:#94a3b8; --card:#1e2535; --border:#2d3748;
          --green:#10b981; --red:#ef4444; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; padding:2rem;
         background-image:radial-gradient(ellipse at 50% 0%, rgba(99,102,241,.12) 0%, transparent 70%); }
  .logo { font-size:1.5rem; font-weight:900; margin-bottom:2.5rem; text-align:center;
          background:linear-gradient(135deg,#6366f1,#8b5cf6); -webkit-background-clip:text;
          -webkit-text-fill-color:transparent; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:20px;
          padding:2.5rem; width:100%; max-width:420px; }
  h1 { font-size:1.75rem; font-weight:800; margin-bottom:.5rem; }
  .subtitle { color:var(--muted); font-size:.9rem; margin-bottom:2rem; }
  label { display:block; font-size:.85rem; font-weight:600; color:var(--muted);
          margin-bottom:.4rem; }
  input { width:100%; background:#0f1623; border:1px solid var(--border); border-radius:10px;
          padding:.75rem 1rem; color:var(--text); font-size:1rem; outline:none; transition:border .2s;
          margin-bottom:1.25rem; }
  input:focus { border-color:var(--accent); }
  input::placeholder { color:#475569; }
  .btn { width:100%; background:linear-gradient(135deg,var(--accent),var(--accent2));
         color:#fff; border:none; padding:.85rem; border-radius:12px; font-size:1rem;
         font-weight:700; cursor:pointer; transition:all .2s; margin-top:.5rem; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 10px 30px rgba(99,102,241,.4); }
  .btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
  .divider { text-align:center; color:var(--muted); font-size:.85rem; margin:1.5rem 0;
             position:relative; }
  .divider::before,.divider::after { content:''; position:absolute; top:50%; width:42%;
                                      height:1px; background:var(--border); }
  .divider::before { left:0; } .divider::after { right:0; }
  .link { color:var(--accent); text-decoration:none; font-weight:600; }
  .link:hover { text-decoration:underline; }
  .footer-link { text-align:center; font-size:.85rem; color:var(--muted); margin-top:1.5rem; }
  .alert { border-radius:10px; padding:.75rem 1rem; font-size:.85rem; margin-bottom:1rem; display:none; }
  .alert.error { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#fca5a5; }
  .alert.success { background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); color:#6ee7b7; }
</style>
</head>
<body>

<div class="logo">⚡ GENIA Publisher</div>

<div class="card">
  <h1>Bem-vindo de volta</h1>
  <p class="subtitle">Acesse seu dashboard para gerenciar seus e-books</p>

  <div class="alert error" id="alertError"></div>
  <div class="alert success" id="alertSuccess"></div>

  <form id="loginForm">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" required>
    <label>Senha</label>
    <input type="password" id="password" placeholder="••••••••" required>
    <button type="submit" class="btn" id="btnLogin">Entrar</button>
  </form>

  <div class="divider">ou</div>
  <div class="footer-link">Não tem conta? <a href="/register" class="link">Criar conta grátis</a></div>
  <div class="footer-link" style="margin-top:.75rem;"><a href="/" class="link" style="color:var(--muted)">← Voltar ao início</a></div>
</div>

<script>
  // Redirecionar se já logado
  const token = localStorage.getItem('genia_token');
  if (token) {
    fetch('/auth/me', { headers: { Authorization: 'Bearer ' + token } })
      .then(r => r.ok && (window.location.href = '/dashboard'))
      .catch(() => {});
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const errEl = document.getElementById('alertError');
    const okEl  = document.getElementById('alertSuccess');
    errEl.style.display = 'none';
    okEl.style.display  = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erro ao entrar');
      localStorage.setItem('genia_token', data.token);
      localStorage.setItem('genia_user', JSON.stringify(data.user));
      okEl.textContent = 'Login realizado! Redirecionando...';
      okEl.style.display = 'block';
      setTimeout(() => window.location.href = '/dashboard', 800);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
