<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Catálogo de E-books — EbookCaster</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
  }
  header {
    padding: 24px 20px; text-align: center; border-bottom: 1px solid #1e293b;
    background: #111827;
  }
  header h1 { margin: 0 0 6px; font-size: 22px; }
  header p { margin: 0; color: #94a3b8; font-size: 14px; }
  .badge {
    display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px;
    background: #7c3aed22; color: #c4b5fd; font-size: 12px; border: 1px solid #7c3aed55;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px;
  }
  .card {
    background: #1e293b; border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column; border: 1px solid #334155;
  }
  .card img {
    width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #0f172a;
  }
  .card .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card h3 { margin: 0; font-size: 14px; line-height: 1.3; min-height: 36px; }
  .card p {
    margin: 0; font-size: 12px; color: #94a3b8; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    flex: 1;
  }
  .card a.dl {
    margin-top: 6px; text-align: center; padding: 8px; border-radius: 6px;
    background: #7c3aed; color: #fff; text-decoration: none; font-size: 13px; font-weight: 600;
  }
  .card a.dl:hover { background: #6d28d9; }
  .pagination {
    display: flex; justify-content: center; align-items: center; gap: 10px;
    margin: 32px 0 8px; flex-wrap: wrap;
  }
  .pagination button {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; font-size: 14px;
  }
  .pagination button:disabled { opacity: .4; cursor: default; }
  .pagination button:not(:disabled):hover { background: #334155; }
  .pageinfo { color: #94a3b8; font-size: 13px; }
  .status { text-align: center; padding: 60px 0; color: #94a3b8; }
</style>
</head>
<body>
<header>
  <h1>Catálogo de E-books — EbookCaster</h1>
  <p>Download liberado temporariamente, sem cobrança</p>
  <span class="badge" id="totalBadge">carregando...</span>
</header>
<main>
  <div id="status" class="status">Carregando catálogo…</div>
  <div class="grid" id="grid"></div>
  <div class="pagination" id="pagination"></div>
</main>
<script>
(function () {
  var grid = document.getElementById('grid');
  var statusEl = document.getElementById('status');
  var pag = document.getElementById('pagination');
  var totalBadge = document.getElementById('totalBadge');
  var params = new URLSearchParams(location.search);
  var page = parseInt(params.get('page'), 10) || 1;
  var pageSize = 50;

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return map[c];
    });
  }

  function render(data) {
    statusEl.style.display = 'none';
    totalBadge.textContent = data.total + ' e-books disponíveis';
    grid.innerHTML = data.items.map(function (it) {
      return '<div class="card">' +
        '<img src="' + location.origin + it.coverUrl + '" alt="' + escapeHtml(it.title) + '" loading="lazy" onerror="this.style.opacity=0.2">' +
        '<div class="body">' +
        '<h3>' + escapeHtml(it.title) + '</h3>' +
        '<p>' + escapeHtml(it.description) + '</p>' +
        '<a class="dl" href="' + location.origin + it.downloadUrl + '" download>Baixar PDF</a>' +
        '</div></div>';
    }).join('');

    var totalPages = data.totalPages;
    var html = '';
    html += '<button ' + (page <= 1 ? 'disabled' : '') + ' data-page="' + (page - 1) + '">Anterior</button>';
    html += '<span class="pageinfo">Página ' + data.page + ' de ' + totalPages + '</span>';
    html += '<button ' + (page >= totalPages ? 'disabled' : '') + ' data-page="' + (page + 1) + '">Próxima</button>';
    pag.innerHTML = html;
    var btns = pag.querySelectorAll('button[data-page]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function (ev) {
        page = parseInt(ev.currentTarget.getAttribute('data-page'), 10);
        var url = new URL(location.href);
        url.searchParams.set('page', page);
        history.replaceState(null, '', url);
        load();
      });
    }
  }

  function load() {
    statusEl.style.display = 'block';
    statusEl.textContent = 'Carregando catálogo…';
    grid.innerHTML = '';
    // location.origin nunca inclui credenciais user:pass@ da URL — fetch com
    // base credenciada é bloqueado pelos browsers.
    fetch(location.origin + '/catalog/api/ebooks?page=' + page + '&pageSize=' + pageSize)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) throw new Error(data.error || 'Erro desconhecido');
        render(data);
      })
      .catch(function (e) {
        statusEl.textContent = 'Erro ao carregar catálogo: ' + e.message;
      });
  }

  load();
})();
</script>
</body>
</html>
