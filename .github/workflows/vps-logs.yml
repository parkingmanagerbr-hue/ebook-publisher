name: VPS Logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'Number of log lines'
        required: false
        default: '100'
      since:
        description: 'Since (e.g. 10m, 1h)'
        required: false
        default: '15m'

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch logs from VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== CONTAINER STATUS ==="
            docker ps --filter name=ebook-publisher --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            echo ""
            echo "=== IMAGE DIGEST ==="
            docker inspect platform-ebook-publisher-1 --format '{{.Image}}' 2>/dev/null | cut -c1-20
            docker inspect platform-ebook-publisher-1 --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null || true
            echo ""
            echo "=== LOGS (last ${{ inputs.lines }} lines, since ${{ inputs.since }}) ==="
            docker logs platform-ebook-publisher-1 --tail ${{ inputs.lines }} --since ${{ inputs.since }} 2>&1
