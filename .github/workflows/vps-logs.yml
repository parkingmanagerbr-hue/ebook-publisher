name: VPS Logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'Número de linhas de log'
        required: false
        default: '100'
      since:
        description: 'Desde quando (ex: 10m, 1h, 30m)'
        required: false
        default: '15m'
      container:
        description: 'Container (dashboard | mega-agent | both)'
        required: false
        default: 'both'
      redeploy:
        description: 'Forçar redeploy antes de buscar logs (true/false)'
        required: false
        default: 'false'

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR (para pull)
        if: ${{ inputs.redeploy == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Redeploy no VPS
        if: ${{ inputs.redeploy == 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== PULLING LATEST IMAGE ==="
            docker pull ghcr.io/parkingmanagerbr-hue/ebook-publisher:latest
            echo "=== FORCE RECREATE (dashboard + mega-agent) ==="
            cd /home/deploy/ebook-publisher-work
            docker compose -f docker-compose.production.yml up -d --force-recreate ebook-publisher ebook-mega-agent
            echo "=== AGUARDANDO 15s PARA INICIALIZAÇÃO ==="
            sleep 15

      - name: Buscar logs do VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            LINES="${{ inputs.lines }}"
            SINCE="${{ inputs.since }}"
            CONTAINER="${{ inputs.container }}"

            echo "========================================================"
            echo "  STATUS DOS CONTAINERS"
            echo "========================================================"
            docker ps \
              --filter name=ebook-publisher \
              --filter name=ebook-mega-agent \
              --format "table {{.Names}}\t{{.Status}}\t{{.RunningFor}}\t{{.Image}}" 2>/dev/null
            echo ""

            echo "========================================================"
            echo "  VERSÃO DA IMAGEM"
            echo "========================================================"
            IMG=$(docker inspect platform-ebook-publisher-1 --format '{{.Image}}' 2>/dev/null)
            echo "Image SHA: $IMG"
            docker inspect $IMG --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null | head -c 12 || echo "(sem label de revisão)"
            docker inspect $IMG --format '{{index .Config.Labels "org.opencontainers.image.created"}}' 2>/dev/null || echo ""
            echo ""

            # Dashboard
            if [ "$CONTAINER" = "dashboard" ] || [ "$CONTAINER" = "both" ]; then
              echo "========================================================"
              echo "  LOGS — platform-ebook-publisher-1 (dashboard)"
              echo "  últimas $LINES linhas | desde $SINCE"
              echo "========================================================"
              docker logs platform-ebook-publisher-1 \
                --tail "$LINES" --since "$SINCE" 2>&1 || echo "(container não encontrado)"
              echo ""
            fi

            # MegaAgent
            if [ "$CONTAINER" = "mega-agent" ] || [ "$CONTAINER" = "both" ]; then
              echo "========================================================"
              echo "  LOGS — platform-ebook-mega-agent-1 (geração/publicação)"
              echo "  últimas $LINES linhas | desde $SINCE"
              echo "========================================================"
              docker logs platform-ebook-mega-agent-1 \
                --tail "$LINES" --since "$SINCE" 2>&1 || echo "(container não encontrado)"
            fi
